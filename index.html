const DATA = {"content_ideas": [{"rank": 5, "id": "CONTENT-001", "title": "\"AI builds a VR game in IWSDK\" content series", "kind": "content", "badge": "Content Idea", "thesis": "A video/post series where an AI agent builds a complete VR game in IWSDK on camera \u2014 methodology transparent, failures included \u2014 mirroring the seed video's format but for VR/XR.", "why": "Three videos now validate the format: the seed space-game video, \"MCP for Unity Pro\" (empty scene \u2192 playable mini-game, honest failures shown), and a Meta developer advocate who built & launched a real Horizon Store VR game in 30 days with the same agent+MCP loop. Doing it in IWSDK showcases the SDK's agent-buildability to exactly the audience Felix wants \u2014 and he already owns the distribution: his YouTube channel Immersive Web Adventures (https://m.youtube.com/@immersive-web-adventures). Requires a genuinely good prototype first \u2014 no vapor.", "evidence": [{"video_id": "Z9fyPTQVEdI", "video_title": "AI Built This Space Game From Scratch \u2014 Here's Exactly How", "video_url": "https://www.youtube.com/watch?v=Z9fyPTQVEdI", "point": "format analysis"}, {"video_id": "qZVM8m1jAiE", "video_title": "MCP for Unity Pro \u2014 AI Builds a Game from an Empty Scene", "video_url": "https://www.youtube.com/watch?v=qZVM8m1jAiE", "point": "the episode to answer: \"IWSDK answers Unity MCP Pro\" \u2014 same empty-scene\u2192game arc, IWSDK's file-first philosophy as the differentiator"}, {"video_id": "eS0f7W6Y6cE", "video_title": "I Built & Launched a VR/MR Game in 30 Days with AI!", "video_url": "https://www.youtube.com/watch?v=eS0f7W6Y6cE", "point": "a Meta insider used this exact loop to ship a store game \u2014 the strongest possible validation). New"}, {"video_id": "OhTtCYA2z8A", "video_title": "Build Interactive 3D Worlds With GPT-6 & Blender", "video_url": "https://www.youtube.com/watch?v=OhTtCYA2z8A", "point": "Higgsfield generates TikTok/reel trailers from the actual Blender game assets via Kling/Seed Dance/Flux \u2014 the \"promo from the real assets\" production pattern solves the game/marketing consistency problem for the channel). New"}, {"video_id": "3NYJCiNGZ2k", "video_title": "I Built a 3D ARPG in Unity Using Bezi AI", "video_url": "https://www.youtube.com/watch?v=3NYJCiNGZ2k", "point": "the honest sponsored ARPG video is the strongest third-party format validation \u2014 plan-first, milestone-by-milestone, failures shown; and it gives the \"IWSDK answers Bezi\" episode its hook: Bezi's agent *cannot run the scene*, every check is a manual Play-mode press \u2014 IWSDK's headless verify loop is the exact thing the video's dev was missing). New"}, {"video_id": "60i4swdPb5c", "video_title": "I Made 2 AIs Build a Flight Simulator \u2014 One Looked Insane", "video_url": "https://www.youtube.com/watch?v=60i4swdPb5c", "point": "2026-09-18 \u2014 the flight-sim bake-off's zero-asset constraint \"no models, no assets, primitives, codes and shaders\" is the episode format to copy for an IWSDK episode: same constraint, built live in IWSDK; and its stage-card + uncut-footage device \u2014 \"S3 \u00b7 takeoff \u2014 Vr 128, one take\" \u2014 is the honesty format for showing verification on camera). New"}, {"video_id": "mNjBBO1gWFI", "video_title": "I'm Finally Making My Dream Game - With AI From Scratch", "video_url": "https://www.youtube.com/watch?v=mNjBBO1gWFI", "point": "2026-09-18 \u2014 the week-long devlog format itself: wins, failures, \"played 200 times,\" losing on camera; the human-AI collaboration beats \u2014 \"AI suggested the biome name and I loved it,\" \"do not delegate what you don't understand\" \u2014 are what make the format work for a channel). New"}, {"video_id": "cA_rxSe6t0o", "video_title": "AI Built Me Minecraft on the Moon \u2014 So I Had to Destroy It", "video_url": "https://www.youtube.com/watch?v=cA_rxSe6t0o", "point": "+"}, {"video_id": "bhqlDh2tAt0", "video_title": "Fable 5.1 Is an Absolute MONSTER (vs Opus 5)", "video_url": "https://www.youtube.com/watch?v=bhqlDh2tAt0", "point": "2026-09-18 \u2014 the Can It Code? bake-off series is now thrice validated: milestone-per-prompt escalation with visual acceptance per stage, zero-asset-constraint episodes (\"no polygon limit, two hours, make it stunning\"), gameplay-verdict-by-playing as the episode device; the moon-Minecraft video adds a fresh content beat \u2014 the build-destroy arc (\"The moon will belong to no one\") \u2014 and confirms the one-twist art-direction contract as an episode template: \"IWSDK answers Can It Code?\" under the zero-asset constraint).\n\nNew"}, {"video_id": "vy9Jk2GavLc", "video_title": "Let's code! Starting up a 3D game from scratch with Claude.ai.", "video_url": "https://www.youtube.com/watch?v=vy9Jk2GavLc", "point": "2026-09-18 \u2014 **pair-programming-with-mentorship** is a strong candidate episode format: a veteran dev narrates AI builds live, encoding wisdom as he goes \u2014 \"AI builds a VR game in IWSDK\" could be filmed the same way with Felix as the veteran voice). New"}, {"video_id": "sy362Pv3mCw", "video_title": "How Game Devs Use AI Today (Navik Gaming Podcast)", "video_url": "https://www.youtube.com/watch?v=sy362Pv3mCw", "point": "2026-09-18 \u2014 **framing caution**: Western gamers show mob-mentality anti-AI sentiment (the blockchain-gaming arc); the series should lead with craft and human direction, not with \"AI did this\" \u2014 East-market content can be more openly AI-forward; lunch-break prototyping is the business case for the episode format \u2014 cheap prototypes let you *prove before you plan*).\n\nNew"}, {"video_id": "A_pC-9346s0", "video_title": "How I'm Using AI to Speed Up 3D Character Creation for Blender & Unreal", "video_url": "https://www.youtube.com/watch?v=A_pC-9346s0", "point": "2026-09-18 \u2014 the format itself is a template worth copying for the channel: creator's workflow made fully explicit, with cost/time data per step and an honest \"what automates / what doesn't\" verdict \u2014 exactly the transparency framing the anti-AI-sentiment caution demands).\n\nNew"}, {"video_id": "LMu0QHzjsUY", "video_title": "I Let AI Build a Full 2D Platformer in Unity \u2014 Here's What Happened", "video_url": "https://www.youtube.com/watch?v=LMu0QHzjsUY", "point": "2026-09-18 \u2014 the \"5\u20136 prompts\" birdie platformer: the asset-store upgrade lane \u2014 pasting an Asset Store screenshot and telling the agent \"use this fog module\" \u2014 is an episode beat worth stealing for the channel; the honest craft-gap admission (\"I can keep falling but still, it's a working game\") is the honesty device the series format needs).\n\nNew"}, {"video_id": "cXRTDPzgPyk", "video_title": "Claude Makes Minecraft From Scratch in 50 Hours (Lucky Break)", "video_url": "https://www.youtube.com/watch?v=cXRTDPzgPyk", "point": "2026-09-19 \u2014 Lucky Break, Claude's 50-hour Minecraft: the **\"playable now, polish later\" public-playtest beat** \u2014 the game shipped to a free itch.io link *before* polish (\"I'd rather hear what you guys think now than after who knows how many more hours of polish\"), with Discord as the bug-report channel; and the **controlled-chaos rules economy** \u2014 rules scramble once then lock (learnable half), per-action outcomes re-roll every time (unlearnable half) \u2014 as a content hook in itself).\n\nNew"}, {"video_id": "tOlRL19Jtb4", "video_title": "I Remade My Game In 1 Month Using AI (UE5.7) | Robowild Devlog 2", "video_url": "https://www.youtube.com/watch?v=tOlRL19Jtb4", "point": "2026-09-19 \u2014 Robowild Devlog 2: the **devlog-series format** \u2014 Devlog 1 \u2192 Devlog 2 arc, zero-to-10-instances narrative; the **quirks-as-features honesty device** \u2014 mojibake corruption in a memory file repurposed as the game's loading screen, hallucination maps shipped as playable biomes).\n\nNew"}, {"video_id": "aaTkO6J-CQU", "video_title": "Can AI Really Make GAMES? (I Tested It)", "video_url": "https://www.youtube.com/watch?v=aaTkO6J-CQU", "point": "2026-09-19 \u2014 the **\"AI as tool, not replacement\" framing**, stated by the creator as the video's thesis (\"AI... is not meant to replace you... it is meant to help you reach further\"), is the lead the anti-AI-sentiment caution demands; the **sponsored-but-honest posture** \u2014 sponsorship disclosed, defects admitted on camera (duplicate card image, draw bug, self-inflicted bad UI) \u2014 is a sponsorship model the series could copy).\n\nNew"}, {"video_id": "VGvxWDRyU90", "video_title": "This Game Makes $160K/Day So I Made My Own With Claude Code AI in 4 DAYS", "video_url": "https://www.youtube.com/watch?v=VGvxWDRyU90", "point": "2026-09-19 \u2014 the **professional-credibility device**: ex-Voodoo engineer, real shipped-revenue numbers, publisher deal mechanics ($3\u20134K/prototype/month + rev share) on camera; the **\"Architect Method\"** \u2014 \"you're the architect, the AI is just the executioner\" \u2014 as a borrowable episode framing; \"engineers will not be replaced, they will be enhanced\" as the anti-sentiment lead).\n\nNew"}, {"video_id": "L4lKXCj6oSY", "video_title": "This New GPT 6 System Builds Entire 3D Worlds Insanely Well", "video_url": "https://www.youtube.com/watch?v=L4lKXCj6oSY", "point": "2026-09-19 \u2014 the **\"IWSDK answers the Abacus loop \u2014 but in VR\"** episode hook: Abacus Astra's concept-target \u2192 build \u2192 screenshot-self-inspect \u2192 fix \u2192 deploy loop is the first flat-screen proof that the autonomous visual-acceptance loop works end-to-end on the Three.js+GLB stack; IWSDK's answer is the same loop *with a headset on* \u2014 WebXR-native, UIKitML spatial UI, and the headless numeric-assertion verify the video's loop approximates).\n\nNew"}, {"video_id": "X2gBdo5CX9U", "video_title": "How I Made an $81,000 AI Game for $3! (Claude Code + jCodeMunch)", "video_url": "https://www.youtube.com/watch?v=X2gBdo5CX9U", "point": "2026-09-19 \u2014 the **$81k-to-$3 cost-of-context beat**: an agentic coding loop with no memory between turns re-reads the whole codebase every prompt; a candidate honesty-beat for the series showing *why* the loop's context-hygiene rules exist). **Strengthened 2026-09-21:** full note rewrite with evidence-tiered audit \u2014 the $81k anchor is **measured** (Brillante's usage-dashboard screenshot, independently reported June 2026), the $3 is **vendor self-report**; the honesty beat works *only* if the episode shows the tiers on camera (\"measured\" vs \"self-reported\"), not as a flat \"$81k \u2192 $3\" claim.\n\nNew"}, {"video_id": "9kejfKCb0S8", "video_title": "I Built a Souls-Like Game in 3 Days - Every Asset Made by AI", "video_url": "https://www.youtube.com/watch?v=9kejfKCb0S8", "point": "2026-09-19 \u2014 the **anti-one-prompt quote as series framing**: \"I do not believe AI one-shot game in one prompt. That's tasteless bull****... at least you need taste and great idea\"; and the **\"leverage for professionals first\"** thesis \u2014 the pro-side of the tool-not-replacement framing; plus the **72h time-box** as an episode format).\n\nNew"}, {"video_id": "NTmeC9axpqA", "video_title": "I Built a 3D Multiplayer Game in 8 Days for $7 Using AI", "video_url": "https://www.youtube.com/watch?v=NTmeC9axpqA", "point": "2026-09-19 \u2014 the **distribution-as-platform beat**: Farcaster mini apps \u2014 games embedded in a social feed with a signed manifest, and a $200k hackathon prize pool as the shipping incentive \u2014 is how a web game finds players without a store; the series needs a distribution episode).\n\nNew"}, {"video_id": "NwKZOn3O5oI", "video_title": "Vibe Code a Complete 2D Beat 'Em Up Game From Scratch - Full Tutorial (Codex, Phaser, Images 2.0)", "video_url": "https://www.youtube.com/watch?v=NwKZOn3O5oI", "point": "2026-09-19 \u2014 the **skills-catalog beat**: vibegamedev.com runs a public catalog of \"game development specific agent skills\" + full source \u2014 the market shape IWSDK's own LOOP-SKILL.md/ASSET-SKILL.md would compete in; and the **candidate-generation beat**: 4 AI background candidates in parallel, human picks \u2014 the selection moment is watchable content).\n\nNew"}, {"video_id": "hwkUu7QZoBg", "video_title": "I Just Told AI to Build 4 Games. It Actually Did It.", "video_url": "https://www.youtube.com/watch?v=hwkUu7QZoBg", "point": "2026-09-19 \u2014 the **$0 free-tier-stacking beat**: \"without spending a single dime... we only use free trials and daily free credits\" \u2014 the genre's entry price is $0/day, the honest cost framing the series needs; and the **guardrails**: Gemini's AI-star watermark scrubbed with a green square, and a ripped Ken sprite sheet dropped into Claude \u2014 watermark-scrubbing and copyrighted assets are genre-normalized behaviors the channel must explicitly avoid).\n\nNew"}, {"video_id": "9SDZuJgKIvU", "video_title": "I Let AI Build an FPS Game Environment in Unity | MCP + Antigravity", "video_url": "https://www.youtube.com/watch?v=9SDZuJgKIvU", "point": "ITMetaTechs Antigravity FPS build): the format template for the series \u2014 sped-up agent footage + honest framing (\"Not really\" on replacing a dev, MCP = communication layer not magic). The critique-pass beat (agent role-plays level designer, critiques player-POV) and the player-POV verify rule are strong content beats: \"AI checks its own work like a level designer would.\""}], "status": "proposed \u2014 blocked on a prototype worth filming.", "next_step": "which game concept to film once a prototype lands (public playable deploy still needs his explicit approval per standing boundary).\n\nNew: `notes/RQd5c5AYNpo.md` (2026-09-19 \u2014 the **\"while I listen\" ambient-narration framing**: the orchestrator reads agent reports aloud while the field keeps working \u2014 a candidate episode device: film the orchestration surface (agents as live objects) with voice narration, not the code editor; the human's supervision posture is the watchable content).\n\nNew: `notes/-i2CDDXjygs.md` (2026-09-19 \u2014 **'video = release notes for a live public link'**: the episode's game ships to a public playable link with the video as the release channel, link in the first line); the **honest-stats discipline** (dashboard numbers explicitly labeled as the *other* game; Turbo Town's 213 plays stated plainly) as the channel's trust device; **60k plays/30d + 9-min average sessions** as the browser-playable-link distribution proof \u2014 the distribution-as-platform beat keeps strengthening; and **'top comment = next update'** as the series engine (audience as the product backlog).", "questions": [{"prompt": "Which game concept should we film for the first \"AI builds a VR game in IWSDK\" episode?", "choices": [], "text": "Game concept"}], "cost_usd": null}], "proposals": [{"rank": 1, "id": "SDK-001", "title": "First-class headless-Blender asset workflow for IWSDK", "kind": "sdk", "badge": "Implemented", "thesis": "IWSDK needs a reusable, documented pipeline for generating game-ready 3D assets with headless Blender (`bpy`) scripts \u2014 the way the \"AI Built This Space Game\" video did it \u2014 so AI agents (and users) can produce assets that drop straight into IWSDK scenes.", "why": "The seed video's strongest methodology finding was that all final art came from generated `bpy` scripts run headless, with greybox-then-detail discipline. IWSDK has no equivalent story today; asset creation is the biggest friction in the \"AI builds a game\" loop. This is product-level leverage, not a demo.", "evidence": [{"video_id": "Z9fyPTQVEdI", "video_title": "AI Built This Space Game From Scratch \u2014 Here's Exactly How", "video_url": "https://www.youtube.com/watch?v=Z9fyPTQVEdI", "point": "astronaut: 41 rigid parts / 17 joints procedural; texture-scale > texture-choice finding; shadow-light perf multiplication 30\u219250 FPS). Third sighting"}, {"video_id": "zBaz6WypTis", "video_title": "Human-Controlled AI for 3D Creation: Blender + Foundry Hosted Age     <div class="idea-top"><span class="rank">#${p.rank}</span>
      <span class="badge ${badgeClass(p.badge)}">${esc(p.badge)}</span>
      <span class="iid">${esc(p.id)}</span></div>
    <h2>${esc(p.title)}</h2>
    <p class="thesis">${esc(p.thesis)}</p>
    <div class="sec-label">Why it matters</div>
    <p class="body">${esc(p.why)}</p>
    <div class="sec-label">Evidence</div>
    <ul class="ev">${evidenceHtml(p.evidence)}</ul>
    <div class="sec-label">Status &amp; next step</div>
    <p class="kv"><b>Status:</b> ${esc(p.status.split('—')[0].trim())}</p>
    <p class="kv"><b>Next:</b> ${esc(p.next_step)}</p>
    ${p.cost_usd ? `<div class="cost"><span title="Claude Code API cost (estimate)">🤖 $${p.cost_usd.toFixed(2)}</span> build cost</div>` : ''}
    ${(p.questions || []).length ? `<div class="sec-label">Needs your call</div>` +
      p.questions.map((q, qi) => `
      <div class="q-block">
        <p class="q-prompt">${esc(q.prompt)}</p>
        ${(q.choices || []).map(c => `<span class="chip" data-q="${esc(p.id)}::${qi}" data-v="${esc(c)}">${esc(c)}</span>`).join('')}
        ${q.text ? `<input class="note-input" data-t="${esc(p.id)}::${qi}" placeholder="${esc(q.text)}">` : ''}
      </div>`).join('') : ''}
  </article>`;

const feed = [...(DATA.proposals || []), ...(DATA.content_ideas || [])]
  .sort((a, b) => a.rank - b.rank);
$('feed').innerHTML = feed.map(ideaCard).join('') || '<p style="color:var(--mut)">No ideas yet.</p>';

$('prototypes').innerHTML = (DATA.prototypes || []).map(p => `
  <div class="mini"><b>${esc(p.title)}</b>
  <div class="meta">${esc(p.id)} · ${esc(p.status)}${p.detail ? ' — ' + esc(p.detail.slice(0, 220)) + (p.detail.length > 220 ? '…' : '') : ''}</div></div>`
).join('') || '<p style="color:var(--mut)">None yet.</p>';

const vids = DATA.videos || [];
const analyzed = vids.filter(v => v.status === 'analyzed');
const queued = vids.filter(v => v.status !== 'analyzed');
$('videos').innerHTML =
  analyzed.map(v => `<div class="mini"><a href="${v.url}">${esc(v.title)}</a>
    <div class="meta">${esc(v.channel || '')}${v.date ? ' · ' + esc(v.date) : ''}${(v.findings || []).length ? ' · ' + v.findings.length + ' findings' : ''}</div></div>`).join('') +
  (queued.length ? `<div class="sec-label" style="margin-top:14px">Queued (${queued.length})</div>` +
    queued.map(v => `<div class="mini"><a href="${v.url}">${esc(v.title)}</a><div class="meta">${esc(v.channel || '')}</div></div>`).join('') : '');

// Stats live in the footer, de-emphasized, per the feed-first design.
const s = DATA.stats || {};
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const bits = [];
if (s.videos_analyzed != null) bits.push(pl(s.videos_analyzed, 'video analyzed', 'videos analyzed'));
if (s.videos_queued != null) bits.push(pl(s.videos_queued, 'queued', 'queued'));
if (s.sdk_proposals != null) bits.push(pl(s.sdk_proposals, 'SDK proposal', 'SDK proposals'));
if (s.content_ideas != null) bits.push(pl(s.content_ideas, 'content idea', 'content ideas'));
if (s.prototypes != null) bits.push(pl(s.prototypes, 'prototype', 'prototypes'));
if (s.claude_spend_usd != null) bits.push(`Claude spend $${s.claude_spend_usd.toFixed(2)}*`);
$('statsline').innerHTML = bits.join(' · ') +
  `<br><span class="fine">Source of truth: private repo <code>kitbyfez/ai-game-dev-radar</code>. Updated hourly.` +
  `<br>*Claude spend is the CLI-reported estimate, not official Anthropic billing.</span>`;

// ---- Questions for Felix: per-item structured questions -> copyable feedback block ----
const answers = {}; // "ID::qi" -> {choice, text}
const qIndex = {};  // "ID::qi" -> {id, title, prompt}
feed.forEach(p => (p.questions || []).forEach((q, qi) => {
  qIndex[`${p.id}::${qi}`] = { id: p.id, title: p.title, prompt: q.prompt };
}));
document.addEventListener('click', e => {
  const ch = e.target.closest('[data-q]');
  if (!ch) return;
  const key = ch.dataset.q;
  const cur = answers[key] || {};
  document.querySelectorAll(`[data-q="${CSS.escape(key)}"]`).forEach(c => c.classList.remove('on'));
  if (cur.choice === ch.dataset.v) { delete cur.choice; }
  else { cur.choice = ch.dataset.v; ch.classList.add('on'); }
  if (cur.choice || cur.text) answers[key] = cur; else delete answers[key];
  renderBar();
});
document.addEventListener('input', e => {
  const ni = e.target.closest('[data-t]');
  if (!ni) return;
  const key = ni.dataset.t;
  const cur = answers[key] || {};
  cur.text = ni.value.trim();
  if (cur.choice || cur.text) answers[key] = cur; else delete answers[key];
  renderBar();
});
function answeredCount() { return Object.keys(answers).length; }
function renderBar() {
  const n = answeredCount();
  $('respbar').classList.toggle('show', n > 0);
  $('respbar-n').textContent = n === 1 ? '1 answer' : n + ' answers';
}
$('clearbtn').onclick = () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  document.querySelectorAll('[data-t]').forEach(i => { i.value = ''; });
  renderBar();
};
$('copybtn').onclick = async () => {
  const d = new Date().toISOString().slice(0, 10);
  const lines = [`Radar feedback (${d}):`];
  feed.forEach(p => (p.questions || []).forEach((q, qi) => {
    const a = answers[`${p.id}::${qi}`];
    if (!a) return;
    lines.push(`- ${p.id}: ${q.prompt}`);
    if (a.choice) lines.push(`  → ${a.choice}`);
    if (a.text) lines.push(`  Note: ${a.text}`);
  }));
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('copybtn').textContent = 'Copied — paste it in chat';
  setTimeout(() => { $('copybtn').textContent = "Copy answers"; }, 2500);
};
</script>
</body>
</html>
