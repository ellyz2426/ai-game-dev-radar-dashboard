l surface is arguably ahead of the video's ad-hoc checks.", "findings": ["SDK-003: empty-scene-to-playable-game in one IWSDK agent session (ready to prototype)", "CONTENT-001 strengthened: 'IWSDK answers Unity MCP Pro' is the exact episode format"]}, {"channel": "\u2014", "id": "3NYJCiNGZ2k", "status": "queued", "title": "I Built a 3D ARPG in Unity Using Bezi AI", "url": "https://www.youtube.com/watch?v=3NYJCiNGZ2k"}, {"channel": "\u2014", "id": "vy9Jk2GavLc", "status": "queued", "title": "Let's code! Starting up a 3D game from scratch with Claude.ai", "url": "https://www.youtube.com/watch?v=vy9Jk2GavLc"}, {"channel": "AI tool explainer", "id": "OhTtCYA2z8A", "status": "analyzed", "title": "Build Interactive 3D Worlds With GPT-6 & Blender", "url": "https://www.youtube.com/watch?v=OhTtCYA2z8A", "date": "2026-09-18", "methodology": ["GPT-6 'Astra' + Codex drive Blender (screen-visible), 4-5 prompts per asset; Codex sub-agents triage work", "Generated car meshes are editable (calipers, doors, windows selectable)", "Higgsfield Blender plugin generates PBR textures (Mars sand, rocks) + offers 3D models, character animation, video/image gen, camera assets", "Asset -> playable HTML Mars-car game in ~20 min by a non-game-dev", "Trailers (TikTok/reel) generated from the real game assets via Kling/Seed Dance/Flux", "No verification loop shown \u2014 eyeballed in viewport"], "iwskd_relevance": "Fourth SDK-001 sighting; texture generation as a first-class pipeline stage; IWSDK would be the game-runtime half of this loop.", "findings": ["SDK-001 strengthened (texture stage is first-class; game-not-render output)", "CONTENT-001 strengthened (promo-from-real-assets pattern)", "Interesting: harness-agnostic loop docs; IWSDK's verify loop as the missing rigor"]}, {"channel": "Microsoft / David Catuhe", "id": "zBaz6WypTis", "status": "analyzed", "title": "Human-Controlled AI for 3D Creation: Blender + Foundry Hosted Agents", "url": "https://www.youtube.com/watch?v=zBaz6WypTis", "date": "2026-09-18", "methodology": ["Custom Python agent on the Foundry hosted agent platform drives Blender via Blender MCP \u2014 generates bpy on the fly, executes over socket, viewport screenshots back", "Human-in-the-loop as the design contract: AI proposes, human disposes; .blend download to continue by hand", "Per-session micro VMs with idle/wake + scene restore; one agent surfaced in web chat, M365 Copilot, Teams", "Trace waterfall replay, auto telemetry (App Insights), per-call token/cost evaluation (~10-12 cents per world)", "Prompt-level avoidance of bad Blender APIs, iterated from live failure logs"], "iwskd_relevance": "Third independent sighting of the generate-bpy -> run -> screenshot -> iterate loop SDK-001 proposes; IWSDK documents only manual GUI Blender conversion.", "findings": ["SDK-001 strengthened (evidence + 5 refinements: texture stage, human checkpoint phase, negative-API prompt trick, game-not-render output, ~$0.10-0.12/world cost calibration)", "Interesting: trace replay + per-call cost visibility; one-agent-many-surfaces"]}, {"channel": "Ahad Animates", "id": "tXYs9zMbMgE", "status": "queued", "title": "I Turned 3 Images Into Game Assets Using AI | Triverse Artist Mesh", "url": "https://www.youtube.com/watch?v=tXYs9zMbMgE"}, {"channel": "\u2014", "id": "3Kqrdi6mi2w", "status": "queued", "title": "Making Game-Ready 3D Models with AI: From Concept to Final Asset", "url": "https://www.youtube.com/watch?v=3Kqrdi6mi2w"}, {"channel": "\u2014", "id": "A_pC-9346s0", "status": "queued", "title": "How I'm Using AI to Speed Up 3D Character Creation for Blender & Unreal", "url": "https://www.youtube.com/watch?v=A_pC-9346s0"}, {"channel": "Stefan_3D_AI", "id": "mNjBBO1gWFI", "status": "queued", "title": "I'm Building My Dream Game With AI - From Absolute Zero", "url": "https://www.youtube.com/watch?v=mNjBBO1gWFI"}, {"channel": "Naavik", "id": "sy362Pv3mCw", "status": "queued", "title": "How Game Devs Use AI Today", "url": "https://www.youtube.com/watch?v=sy362Pv3mCw"}, {"channel": "\u2014", "id": "LMu0QHzjsUY", "status": "queued", "title": "I Let AI Build a Full 2D Platformer in Unity \u2014 Here's What Happened", "url": "https://www.youtube.com/watch?v=LMu0QHzjsUY"}]};
const $ = id => document.getElementById(id);
$('updated').textContent = 'Last updated ' + new Date(DATA.updated).toLocaleString() + '.';

const badgeClass = b => ({'Proposal':'proposal','Content Idea':'content','Prototyping':'prototyping','Implemented':'implemented'}[b] || 'proposal');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const evidenceHtml = ev => ev.map(e => {
  const vid = e.video_id && e.video_url
    ? `<a href="${e.video_url}">${esc(e.video_title || e.video_id)}</a>`
    : (e.video_id ? `<code>${esc(e.video_id)}</code>` : 'Note');
  return `<li>${vid} — ${esc(e.point)}</li>`;
}).join('');

const ideaCard = p => `
  <article class="idea">
    <div class="idea-top"><span class="rank">#${p.rank}</span>
      <span class="badge ${badgeClass(p.badge)}">${esc(p.badge)}</span>
      <span class="iid">${esc(p.id)}</span></div>
    <h2>${esc(p.title)}</h2>
    <p class="thesis">${esc(p.thesis)}</p>
    <div class="sec-label">Why it matters</div>
    <p class="body">${esc(p.why)}</p>
    <div class="sec-label">Evidence</div>
    <ul class="ev">${evidenceHtml(p.evidence)}</ul>
    <div class="sec-label">Status &amp; next step</div>
    <p class="kv"><b>Status:</b> ${esc(p.status.split('—')[0].trim())}</p>
    <p class="kv"><b>Next:</b> ${esc(p.next_step)}</p>
    ${p.cost_usd ? `<div class="cost"><span title="Claude Code API cost (estimate)">🤖 $${p.cost_usd.toFixed(2)}</span> build cost</div>` : ''}
    ${(p.questions || []).length ? `<div class="sec-label">Needs your call</div>` +
      p.questions.map((q, qi) => `
      <div class="q-block">
        <p class="q-prompt">${esc(q.prompt)}</p>
        ${(q.choices || []).map(c => `<span class="chip" data-q="${esc(p.id)}::${qi}" data-v="${esc(c)}">${esc(c)}</span>`).join('')}
        ${q.text ? `<input class="note-input" data-t="${esc(p.id)}::${qi}" placeholder="${esc(q.text)}">` : ''}
      </div>`).join('') : ''}
  </article>`;

const feed = [...(DATA.proposals || []), ...(DATA.content_ideas || [])]
  .sort((a, b) => a.rank - b.rank);
$('feed').innerHTML = feed.map(ideaCard).join('') || '<p style="color:var(--mut)">No ideas yet.</p>';

$('prototypes').innerHTML = (DATA.prototypes || []).map(p => `
  <div class="mini"><b>${esc(p.title)}</b>
  <div class="meta">${esc(p.id)} · ${esc(p.status)}${p.detail ? ' — ' + esc(p.detail.slice(0, 220)) + (p.detail.length > 220 ? '…' : '') : ''}</div></div>`
).join('') || '<p style="color:var(--mut)">None yet.</p>';

const vids = DATA.videos || [];
const analyzed = vids.filter(v => v.status === 'analyzed');
const queued = vids.filter(v => v.status !== 'analyzed');
$('videos').innerHTML =
  analyzed.map(v => `<div class="mini"><a href="${v.url}">${esc(v.title)}</a>
    <div class="meta">${esc(v.channel || '')}${v.date ? ' · ' + esc(v.date) : ''}${(v.findings || []).length ? ' · ' + v.findings.length + ' findings' : ''}</div></div>`).join('') +
  (queued.length ? `<div class="sec-label" style="margin-top:14px">Queued (${queued.length})</div>` +
    queued.map(v => `<div class="mini"><a href="${v.url}">${esc(v.title)}</a><div class="meta">${esc(v.channel || '')}</div></div>`).join('') : '');

// Stats live in the footer, de-emphasized, per the feed-first design.
const s = DATA.stats || {};
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const bits = [];
if (s.videos_analyzed != null) bits.push(pl(s.videos_analyzed, 'video analyzed', 'videos analyzed'));
if (s.videos_queued != null) bits.push(pl(s.videos_queued, 'queued', 'queued'));
if (s.sdk_proposals != null) bits.push(pl(s.sdk_proposals, 'SDK proposal', 'SDK proposals'));
if (s.content_ideas != null) bits.push(pl(s.content_ideas, 'content idea', 'content ideas'));
if (s.prototypes != null) bits.push(pl(s.prototypes, 'prototype', 'prototypes'));
if (s.claude_spend_usd != null) bits.push(`Claude spend $${s.claude_spend_usd.toFixed(2)}*`);
$('statsline').innerHTML = bits.join(' · ') +
  `<br><span class="fine">Source of truth: private repo <code>ellyz2426/ai-game-dev-radar</code>. Updated hourly.` +
  `<br>*Claude spend is the CLI-reported estimate, not official Anthropic billing.</span>`;

// ---- Questions for Felix: per-item structured questions -> copyable feedback block ----
const answers = {}; // "ID::qi" -> {choice, text}
const qIndex = {};  // "ID::qi" -> {id, title, prompt}
feed.forEach(p => (p.questions || []).forEach((q, qi) => {
  qIndex[`${p.id}::${qi}`] = { id: p.id, title: p.title, prompt: q.prompt };
}));
document.addEventListener('click', e => {
  const ch = e.target.closest('[data-q]');
  if (!ch) return;
  const key = ch.dataset.q;
  const cur = answers[key] || {};
  document.querySelectorAll(`[data-q="${CSS.escape(key)}"]`).forEach(c => c.classList.remove('on'));
  if (cur.choice === ch.dataset.v) { delete cur.choice; }
  else { cur.choice = ch.dataset.v; ch.classList.add('on'); }
  if (cur.choice || cur.text) answers[key] = cur; else delete answers[key];
  renderBar();
});
document.addEventListener('input', e => {
  const ni = e.target.closest('[data-t]');
  if (!ni) return;
  const key = ni.dataset.t;
  const cur = answers[key] || {};
  cur.text = ni.value.trim();
  if (cur.choice || cur.text) answers[key] = cur; else delete answers[key];
  renderBar();
});
function answeredCount() { return Object.keys(answers).length; }
function renderBar() {
  const n = answeredCount();
  $('respbar').classList.toggle('show', n > 0);
  $('respbar-n').textContent = n === 1 ? '1 answer' : n + ' answers';
}
$('clearbtn').onclick = () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  document.querySelectorAll('[data-t]').forEach(i => { i.value = ''; });
  renderBar();
};
$('copybtn').onclick = async () => {
  const d = new Date().toISOString().slice(0, 10);
  const lines = [`Radar feedback (${d}):`];
  feed.forEach(p => (p.questions || []).forEach((q, qi) => {
    const a = answers[`${p.id}::${qi}`];
    if (!a) return;
    lines.push(`- ${p.id}: ${q.prompt}`);
    if (a.choice) lines.push(`  → ${a.choice}`);
    if (a.text) lines.push(`  Note: ${a.text}`);
  }));
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('copybtn').textContent = 'Copied — paste it in chat';
  setTimeout(() => { $('copybtn').textContent = "Copy answers"; }, 2500);
};
</script>
</body>
</html>
